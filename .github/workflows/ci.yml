# Kaizen · Integracion continua
# Corre en cada push y en cada pull request. Los trabajos deben pasar para integrar a main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read            # minimo privilegio: el flujo solo lee el codigo

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true  # si subes otro commit, cancela la corrida vieja

jobs:
  # 1. Estilo y tipos: PEP 8 (ruff) y type hints (mypy)
  estilo:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803        # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1    # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install --require-hashes -r requirements/base.txt -r requirements/dev.txt
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  # 2. Seguridad: codigo inseguro, dependencias con vulnerabilidades y secretos filtrados
  seguridad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803        # v6.1.0
        with:
          fetch-depth: 0                                                       # gitleaks revisa todo el historial
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1    # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install --require-hashes -r backend/requirements/base.txt -r backend/requirements/dev.txt
      - name: bandit (analisis de seguridad del codigo)
        run: bandit -c backend/pyproject.toml -r backend/src
      - name: pip-audit (vulnerabilidades conocidas en las dependencias)
        # pymongo 4.10.1 se mantiene por compatibilidad con MongoDB 4.4 (ver docs/adr/013-pymongo-4-10.md).
        # Sus 5 avisos no aplican a nuestro uso (no usamos KMS, GridFS ni URIs con datos del usuario).
        run: >
          pip-audit --strict -r backend/requirements/base.txt
          --ignore-vuln PYSEC-2026-4294 --ignore-vuln PYSEC-2026-4295
          --ignore-vuln PYSEC-2026-4296 --ignore-vuln PYSEC-2026-4297
          --ignore-vuln CVE-2026-106435
      - name: gitleaks (contrasenas o llaves subidas por error)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact

  # 3. Pruebas con cobertura minima de 60 %
  pruebas:
    runs-on: ubuntu-24.04
    needs: [estilo]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803        # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1    # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install --require-hashes -r requirements/base.txt -r requirements/dev.txt
      - run: pip install --no-deps -e .
      - run: pytest --cov-report=xml
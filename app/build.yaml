# Generación de código (dart run build_runner build --delete-conflicting-outputs).
# Los modelos usan los nombres del contrato en snake_case (fecha_creacion → fechaCreacion).
targets:
  $default:
    builders:
      json_serializable:
        options:
          field_rename: snake
          explicit_to_json: true
          include_if_null: true
          checked: true
